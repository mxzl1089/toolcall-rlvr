[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolcall-rlvr"
version = "0.1.0"
description = "Small-model tool-call post-training and controlled reward diagnostics"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pyarrow", "transformers==4.57.6", "trl==0.26.2", "peft==0.18.1", "accelerate", "datasets", "bitsandbytes", "psutil", "tensorboard", "matplotlib"]

[project.scripts]
toolcall = "toolrl.run:main"

[tool.setuptools.packages.find]
where = ["src"]
